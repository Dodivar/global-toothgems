/* ---- HSV colour wheel: hue ring + saturation/value square ----------------
   One angle convention everywhere: canvas angle θ (0 = 3 o'clock, clockwise)
   maps to hue θ — the painted ring swatch, the picker and the handle all
   agree, so the picked colour is exactly the colour under your finger. ---- */
const WHEEL = { size: 156, r: 74, ring: 16, sq: 80 }
const WHEEL_DPR = Math.min(window.devicePixelRatio || 1, 2)
function ColorWheel({ hex, onPick, onClear }: {
  hex: string | null; onPick: (hex: string) => void; onClear: () => void
}) {
  const [hsv, setHsv] = useState(() => hex ? hexToHsv(hex) : { h: 200, s: 0.75, v: 0.95 })
  const canvasRef = useRef<HTMLCanvasElement>(null)
  const ringRef = useRef<HTMLCanvasElement | null>(null)
  const armed = useRef(false)

  useEffect(() => { // pre-render the hue ring once
    const off = document.createElement('canvas')
    off.width = off.height = WHEEL.size * WHEEL_DPR
    const c = off.getContext('2d')!
    c.scale(WHEEL_DPR, WHEEL_DPR)
    c.lineWidth = WHEEL.ring
    for (let a = 0; a < 360; a++) {
      c.beginPath()
      c.strokeStyle = `hsl(${a} 100% 50%)`
      c.arc(WHEEL.size / 2, WHEEL.size / 2, WHEEL.r - WHEEL.ring / 2, (a - 0.72) * Math.PI / 180, (a + 0.72) * Math.PI / 180)
      c.stroke()
    }
    ringRef.current = off
  }, [])

  useEffect(() => { // redraw on every state change
    const cvs = canvasRef.current, ring = ringRef.current
    if (!cvs || !ring) return
    const ctx = cvs.getContext('2d')!
    ctx.setTransform(WHEEL_DPR, 0, 0, WHEEL_DPR, 0, 0)
    ctx.clearRect(0, 0, WHEEL.size, WHEEL.size)
    ctx.drawImage(ring, 0, 0, WHEEL.size, WHEEL.size)
    const x0 = WHEEL.size / 2 - WHEEL.sq / 2, y0 = WHEEL.size / 2 - WHEEL.sq / 2
    // saturation/value square: hue base + white (→) + black (↓) mixing
    ctx.fillStyle = `hsl(${hsv.h} 100% 50%)`
    ctx.fillRect(x0, y0, WHEEL.sq, WHEEL.sq)
    let g = ctx.createLinearGradient(x0, 0, x0 + WHEEL.sq, 0)
    g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)')
    ctx.fillStyle = g; ctx.fillRect(x0, y0, WHEEL.sq, WHEEL.sq)
    g = ctx.createLinearGradient(0, y0, 0, y0 + WHEEL.sq)
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000')
    ctx.fillStyle = g; ctx.fillRect(x0, y0, WHEEL.sq, WHEEL.sq)
    ctx.strokeStyle = 'rgba(0,0,0,.14)'
    ctx.strokeRect(x0 + 0.5, y0 + 0.5, WHEEL.sq - 1, WHEEL.sq - 1)
    // hue handle (canvas angle = hue)
    const ha = hsv.h * Math.PI / 180
    const hx = WHEEL.size / 2 + Math.cos(ha) * (WHEEL.r - WHEEL.ring / 2)
    const hy = WHEEL.size / 2 + Math.sin(ha) * (WHEEL.r - WHEEL.ring / 2)
    ctx.beginPath(); ctx.arc(hx, hy, 6.5, 0, Math.PI * 2)
    ctx.fillStyle = `hsl(${hsv.h} 100% 50%)`; ctx.fill()
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke()
    // SV handle
    const sx = x0 + hsv.s * WHEEL.sq, sy = y0 + (1 - hsv.v) * WHEEL.sq
    ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI * 2)
    ctx.fillStyle = hsvToHex(hsv.h, hsv.s, hsv.v); ctx.fill()
    ctx.lineWidth = 2; ctx.strokeStyle = hsv.v > 0.6 ? 'rgba(0,0,0,.5)' : '#fff'; ctx.stroke()
  })

  const pick = (e: React.PointerEvent<HTMLCanvasElement>) => {
    const r = e.currentTarget.getBoundingClientRect()
    const x = e.clientX - r.left, y = e.clientY - r.top
    let next: { h: number; s: number; v: number } | null = null
    const x0 = WHEEL.size / 2 - WHEEL.sq / 2, y0 = WHEEL.size / 2 - WHEEL.sq / 2
    if (x >= x0 && x <= x0 + WHEEL.sq && y >= y0 && y <= y0 + WHEEL.sq) {
      // square first — its corners must never fall through to the ring
      next = { h: hsv.h, s: clamp((x - x0) / WHEEL.sq, 0, 1), v: clamp(1 - (y - y0) / WHEEL.sq, 0, 1) }
    } else {
      const dx = x - WHEEL.size / 2, dy = y - WHEEL.size / 2, d = Math.hypot(dx, dy)
      if (d > WHEEL.r - WHEEL.ring - 6 && d < WHEEL.r + 6) {
        let h = Math.atan2(dy, dx) * 180 / Math.PI // canvas angle = hue
        if (h < 0) h += 360
        next = { h, s: hsv.s, v: hsv.v }
      }
    }
    if (next) {
      setHsv(next)
      onPick(hsvToHex(next.h, next.s, next.v)) // live, no history spam (armed once per drag)
    }
  }
  const current = hsvToHex(hsv.h, hsv.s, hsv.v)
  return (
    <div className="color-wheel">
      <canvas ref={canvasRef}
        width={WHEEL.size * WHEEL_DPR} height={WHEEL.size * WHEEL_DPR}
        style={{ width: WHEEL.size, height: WHEEL.size }}
        onPointerDown={(e) => {
          e.currentTarget.setPointerCapture(e.pointerId)
          if (!armed.current) { store.pushHistory(); armed.current = true }
          pick(e)
        }}
        onPointerMove={(e) => { if (e.buttons) pick(e) }}
        onPointerUp={() => { armed.current = false }} />
      <div className="cp-row">
        <span>{(hex ?? current).toUpperCase()}</span>
        {hex && (
          <button className="cp-clear" onClick={onClear}>
            <I name="close" size={11} />Back to presets
          </button>
        )}
      </div>
    </div>
  )
}

function InspectorPanel({ snap }: { snap: StudioSnapshot }) {
  const selected = snap.jewels.filter((j) => snap.selectedJewelIds.includes(j.id))

  /* ---------------- MULTI SELECTION ---------------- */
  if (selected.length > 1) {
    const first = selected[0]
    const teethUsed = new Set(selected.map((j) => j.toothId)).size
    const ids = selected.map((j) => j.id)
    const sharedCustom = selected.every((j) => j.customColor && j.customColor === first.customColor)
      ? first.customColor! : null
    const dup = () => {
      const n = duplicateSelectionSafe(ids)
      if (!n) toast('No free space beside the selection')
      else if (n < ids.length) toast(`${n} of ${ids.length} duplicated — rest had no room`)
      else toast(`${n} pieces duplicated — try Mirror horizontal for a symmetric smile`)
    }
    const del = () => { store.removeJewels(ids); toast(`${selected.length} pieces removed`) }
    const distribute = () => {
      const r = getEngine()?.distributeSelectionAlongArch()
      if (!r) toast('Select at least 3 pieces to distribute')
      else toast(r.skipped > 0 ? `Distributed — ${r.skipped} kept in place (occupied)` : 'Pieces distributed evenly along the arch')
    }
    const align = () => {
      const r = getEngine()?.alignSelectionAtEquator()
      if (!r) toast('Nothing to align')
      else toast(r.skipped > 0 ? `Aligned — ${r.skipped} kept in place (occupied)` : 'Pieces aligned at the crown equator')
    }
    return (
      <aside className="inspector">
        <div className="insp" key="multi">
          <div className="jewel-title">{selected.length} pieces selected</div>
          <div className="jewel-sub">
            Across {teethUsed} {teethUsed === 1 ? 'tooth' : 'teeth'} · Shift-click pieces on the model to add or remove them.
          </div>
          <div className="section-label">Type — all pieces</div>
          <select className="type-select" value={first.jewelryTypeId}
            onChange={(e) => { store.pushHistory(); store.updateSelected({ jewelryTypeId: e.target.value }) }}>
            {(['Crystals', 'Shapes', 'Precious'] as const).map((cat) => (
              <optgroup key={cat} label={cat}>
                {CATALOG.filter((t) => t.category === cat).map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
              </optgroup>
            ))}
          </select>
          <div className="section-label">Size — all pieces</div>
          <Slider label="Diameter" value={first.scale} min={0.25} max={1.8} step={0.05}
            format={(v) => `${(v * 2).toFixed(1)} mm`} onCommit={(v) => store.updateSelected({ scale: v })} />
          <div className="section-label">Rotation — all pieces</div>
          <QuickRotate
            value={first.rotation}
            allAt={(deg) => selected.every((j) => j.rotation === deg)}
            onSet={(deg) => { store.pushHistory(); store.updateSelected({ rotation: deg }) }}
            onPlus90={() => {
              store.pushHistory()
              store.applyPatches(selected.map((j) => ({ id: j.id, patch: { rotation: (j.rotation + 90) % 360 } })))
            }} />
          <Slider label="Spin around normal" value={first.rotation} min={0} max={360} step={1}
            format={(v) => `${Math.round(v)}°`} onCommit={(v) => store.updateSelected({ rotation: v })} />
          <div className="section-label">Finish — all pieces</div>
          <div className="swatches">
            {Object.keys(FINISHES).map((fid) => (
              <button key={fid}
                className={'swatch' + (selected.every((j) => !j.customColor && j.color === fid) ? ' sel' : '')}
                title={FINISHES[fid].label} style={{ background: FINISHES[fid].swatch }}
                onClick={() => { store.pushHistory(); store.updateSelected({ color: fid, customColor: undefined }) }} />
            ))}
            {sharedCustom && <button className="swatch sel" title="Custom colour" style={{ background: sharedCustom }} />}
          </div>
          <div className="section-label">Custom colour — all pieces</div>
          <ColorWheel
            hex={first.customColor ?? null}
            onPick={(hex) => store.updateSelected({ customColor: hex })}
            onClear={() => { store.pushHistory(); store.updateSelected({ customColor: undefined }) }} />
          <div className="section-label">Mounting — all pieces</div>
          <Slider label="Standoff from enamel" value={first.offset ?? 0} min={-0.5} max={1.5} step={0.05}
            format={(v) => `${v >= 0 ? '+' : ''}${v.toFixed(2)}`} onCommit={(v) => store.updateSelected({ offset: v })} />
          <div className="section-label">Layout</div>
          <div className="quick-row" style={{ marginBottom: 0 }}>
            <button className="mini-btn grow" onClick={distribute}>
              <I name="distribute" size={14} />Space evenly
            </button>
            <button className="mini-btn grow" onClick={align}>
              <I name="align" size={14} />Align equator
            </button>
          </div>
          <div className="hint-copy" style={{ marginTop: 8 }}>
            Space evenly re-distributes the selected pieces between the two outermost ones along the arch; Align equator sets every piece to the crown equator of its tooth. Pieces never overlap.
          </div>
          <div className="section-label">Mirror</div>
          <MirrorRow />
          <div className="action-row" style={{ marginTop: 18 }}>
            <button className="act-btn" onClick={dup}><I name="copy" size={14} />Duplicate all</button>
            <button className="act-btn danger" onClick={del}><I name="trash" size={14} />Delete all</button>
          </div>
        </div>
      </aside>
    )
  }

  const jewel = selected[0] ?? null

  /* ---------------- SINGLE SELECTION ---------------- */
  if (jewel) {
    const def = JEWELRY_BY_ID[jewel.jewelryTypeId]
    const info = toothInfo(jewel.toothId)
    const engine = getEngine()
    const surface = engine ? engine.describeSurface(jewel) : ''
    const set = (patch: Partial<PlacedJewelry>, history = true) => {
      if (history) store.pushHistory()
      store.updateJewel(jewel.id, patch)
    }
    return (
      <aside className="inspector">
        <div className="insp" key={jewel.id}>
          <div className="jewel-title">{def.name}</div>
          <div className="jewel-sub">{jewel.toothId === FREE_TOOTH ? 'Free placement' : `Tooth ${jewel.toothId} · ${info.name}`}</div>
          <div className="section-label">Type</div>
          <select className="type-select" value={jewel.jewelryTypeId}
            onChange={(e) => {
              const next = JEWELRY_BY_ID[e.target.value]
              const adoptColor = jewel.color === def.defaultColor
              set({ jewelryTypeId: next.id, color: adoptColor ? next.defaultColor : jewel.color })
            }}>
            {(['Crystals', 'Shapes', 'Precious'] as const).map((cat) => (
              <optgroup key={cat} label={cat}>
                {CATALOG.filter((t) => t.category === cat).map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
              </optgroup>
            ))}
          </select>
          <div className="section-label">Size</div>
          <Slider label="Diameter" value={jewel.scale} min={0.25} max={1.8} step={0.05}
            format={(v) => `${(v * 2).toFixed(1)} mm`} onCommit={(v) => set({ scale: v }, false)} />
          <div className="section-label">Rotation</div>
          <QuickRotate
            value={jewel.rotation}
            onSet={(deg) => set({ rotation: deg })}
            onPlus90={() => set({ rotation: (jewel.rotation + 90) % 360 })} />
          <Slider label="Spin around normal" value={jewel.rotation} min={0} max={360} step={1}
            format={(v) => `${Math.round(v)}°`} onCommit={(v) => set({ rotation: v }, false)} />
          <div className="section-label">Finish</div>
          <div className="swatches">
            {Object.keys(FINISHES).map((fid) => (
              <button key={fid} className={'swatch' + (!jewel.customColor && jewel.color === fid ? ' sel' : '')}
                title={FINISHES[fid].label} style={{ background: FINISHES[fid].swatch }}
                onClick={() => set({ color: fid, customColor: undefined })} />
            ))}
            {jewel.customColor && (
              <button className="swatch sel" title="Custom colour" style={{ background: jewel.customColor }} />
            )}
          </div>
          <div className="section-label">Custom colour</div>
          <ColorWheel
            hex={jewel.customColor ?? null}
            onPick={(hex) => store.updateJewel(jewel.id, { customColor: hex })}
            onClear={() => set({ customColor: undefined })} />
          <div className="section-label">Mounting</div>
          <Slider label="Standoff from enamel" value={jewel.offset ?? 0} min={-0.5} max={1.5} step={0.05}
            format={(v) => `${v >= 0 ? '+' : ''}${v.toFixed(2)}`} onCommit={(v) => set({ offset: v }, false)} />
          <div className="hint-copy" style={{ marginTop: 2 }}>
            Lower the standoff if the piece floats off your model; raise it if it sinks into the enamel.
          </div>
          <div className="section-label">Mirror</div>
          <MirrorRow />
          <div className="section-label">Position</div>
          <select className="tooth-select" value={jewel.toothId}
            onChange={(e) => {
              if (e.target.value === FREE_TOOTH) return
              const ok = getEngine()?.relocateJewelToTooth(jewel.id, e.target.value)
              if (!ok) toast('No free space on that tooth')
            }}>
            {jewel.toothId === FREE_TOOTH && <option value={FREE_TOOTH}>Free placement (unlabeled)</option>}
            {ALL_TEETH.map((fdi) => <option key={fdi} value={fdi}>{fdi} — {toothInfo(fdi).short}</option>)}
          </select>
          <div className="pos-sub" style={{ marginTop: 8 }}>{surface}</div>
          <div className="hint-copy" style={{ marginTop: 6 }}>Drag the piece on the model to reposition it, or right-click it for quick actions. It can touch other pieces, never overlap them.</div>
          <div className="action-row" style={{ marginTop: 20 }}>
            <button className="act-btn" onClick={() => {
              const n = duplicateSelectionSafe([jewel.id])
              toast(n ? 'Piece duplicated — drag it to its new home' : 'No free space beside this piece')
            }}>
              <I name="copy" size={14} />Duplicate
            </button>
            <button className="act-btn danger" onClick={() => { store.removeJewels([jewel.id]); toast('Piece removed') }}>
              <I name="trash" size={14} />Delete
            </button>
          </div>
        </div>
      </aside>
    )
  }

  /* ---------------- TOOTH CARD ---------------- */
  if (snap.selectedToothId && snap.selectedToothId !== FREE_TOOTH) {
    const info = toothInfo(snap.selectedToothId)
    const onTooth = snap.jewels.filter((j) => j.toothId === snap.selectedToothId)
    return (
      <aside className="inspector">
        <div className="insp" key={snap.selectedToothId}>
          <div className="fdi-big">#{snap.selectedToothId}</div>
          <div className="jewel-title" style={{ marginTop: 8, fontSize: 18 }}>{info.name}</div>
          <div className="pos-sub">{info.side} quadrant · FDI notation{snap.modelMode === 'free' ? ' · approximate label' : ''}</div>
          <div className="section-label">Pieces on this tooth</div>
          {onTooth.length === 0 && <div className="hint-copy">No jewelry here yet. Drag a piece from the library onto the model.</div>}
          {onTooth.map((j) => (
            <button key={j.id} className="jewel-row" onClick={() => store.selectJewel(j.id)}>
              <span className="fdi-tag">{j.toothId}</span>{JEWELRY_BY_ID[j.jewelryTypeId].name}
            </button>
          ))}
          <div className="section-label">Camera</div>
          <div className="hint-copy">Double-click any tooth to focus the camera on it.</div>
        </div>
      </aside>
    )
  }

  /* ---------------- OVERVIEW ---------------- */
  const teethUsed = new Set(snap.jewels.map((j) => j.toothId)).size
  return (
    <aside className="inspector">
      <div className="insp">
        <div className="stat-row">
          <div className="stat"><b>{snap.jewels.length}</b><span>Pieces</span></div>
          <div className="stat"><b>{teethUsed}</b><span>Zones</span></div>
        </div>
        <div className="hint-copy" style={{ marginTop: 10 }}>Pieces may touch, but never overlap — occupied spots are refused.</div>
        <div className="section-label">Design</div>
        {snap.jewels.length === 0 && <div className="hint-copy">Nothing placed yet. Drag a jewel from the library onto the arch — it will snap onto the surface and follow its curvature.</div>}
        {snap.jewels.map((j) => (
          <button key={j.id} className="jewel-row" onClick={() => { store.selectJewel(j.id); getEngine()?.focusTooth(j.toothId) }}>
            <span className="fdi-tag">{j.toothId === FREE_TOOTH ? '·' : j.toothId}</span>{JEWELRY_BY_ID[j.jewelryTypeId].name}
          </button>
        ))}
        <div className="section-label">Shortcuts</div>
        <div className="kbd-row"><span>Undo / Redo</span><span><span className="kbd">Ctrl Z</span> <span className="kbd">Ctrl ⇧ Z</span></span></div>
        <div className="kbd-row"><span>Select all pieces</span><span className="kbd">Ctrl A</span></div>
        <div className="kbd-row"><span>Add to selection</span><span className="kbd">Shift + click</span></div>
        <div className="kbd-row"><span>Piece actions</span><span className="kbd">Right-click</span></div>
        <div className="kbd-row"><span>Duplicate selection</span><span className="kbd">D</span></div>
        <div className="kbd-row"><span>Delete selection</span><span className="kbd">Del</span></div>
        <div className="kbd-row"><span>Deselect / cancel</span><span className="kbd">Esc</span></div>
        <div className="kbd-row"><span>Pan camera</span><span className="kbd">Shift + drag</span></div>
        <div className="kbd-row"><span>Focus a tooth</span><span className="kbd">Double-click</span></div>
      </div>
    </aside>
  )
}

function Toasts() {
  const [, force] = useState(0)
  useEffect(() => {
    const l = () => force((x) => x + 1)
    toastListeners.add(l)
    return () => { toastListeners.delete(l) }
  }, [])
  return (
    <div className="toasts">
      {toastList.map((t) => (
        <div className="toast" key={t.id}><I name="check" size={14} />{t.message}</div>
      ))}
    </div>
  )
}

function App() {
  const snap = useStudio()
  useEffect(() => {
    const onKey = (e: KeyboardEvent) => {
      const el = document.activeElement
      const typing = el && ['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName)
      if (e.key === 'Escape') {
        getEngine()?.cancelPlacing()
        if (typing) (el as HTMLElement).blur()
        store.closeContextMenu()
        store.setArmed(null)
        store.deselect()
        return
      }
      if (typing) return
      const meta = e.metaKey || e.ctrlKey
      if (meta && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? store.redo() : store.undo(); return }
      if (meta && e.key.toLowerCase() === 'y') { e.preventDefault(); store.redo(); return }
      if (meta && e.key.toLowerCase() === 'a') {
        e.preventDefault()
        store.selectJewels(store.jewels.map((j) => j.id))
        return
      }
      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (store.selectedJewelIds.length) {
          const n = store.selectedJewelIds.length
          store.removeJewels([...store.selectedJewelIds])
          toast(`${n} ${n === 1 ? 'piece' : 'pieces'} removed`)
        }
        return
      }
      if (e.key.toLowerCase() === 'd' && !meta) {
        if (store.selectedJewelIds.length) {
          const n = duplicateSelectionSafe([...store.selectedJewelIds])
          toast(n === 1 ? 'Piece duplicated' : n > 1 ? `${n} pieces duplicated` : 'No free space beside the selection')
        }
      }
    }
    window.addEventListener('keydown', onKey)
    return () => window.removeEventListener('keydown', onKey)
  }, [])
  useEffect(() => { if (store.restored) toast('Welcome back — your last design was restored') }, [])
  // auto-load a "dentition.glb" served next to this page (skipped on file://)
  useEffect(() => {
    if (location.protocol === 'file:') return
    fetch('dentition.glb')
      .then((r) => {
        const ct = r.headers.get('content-type') || ''
        if (!r.ok || /text\/html/i.test(ct)) throw new Error('missing')
        return r.blob()
      })
      .then((b) => importModelFile(new File([b], 'dentition.glb', { type: 'model/gltf-binary' })))
      .catch(() => { /* not provided — keep the studio arch */ })
  }, [])
  return (
    <div className="app">
      <TopBar snap={snap} />
      <LibraryPanel snap={snap} />
      <Viewport snap={snap} />
      <InspectorPanel snap={snap} />
      <Toasts />
    </div>
  )
}

createRoot(document.getElementById('root')!).render(<App />)
