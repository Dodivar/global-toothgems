      t.key = 1.9; t.keyColor.set(0xffd2a0); t.keyPos.set(16, 26, 44)
      t.fill = 0.22; t.fillColor.set(0xffe6cc)
      t.rim = 0.35; t.env = 0.5; t.expo = 1.08; t.tint.set(0xf1e6d8)
    } else if (p === 'daylight') {
      // bright sun + cool sky fill
      t.key = 2.5; t.keyColor.set(0xffffff); t.keyPos.set(34, 64, 26)
      t.fill = 0.9; t.fillColor.set(0xdcecff)
      t.rim = 1.05; t.env = 1.3; t.expo = 1.0; t.tint.set(0xeef1f5)
    } else {
      // neutral studio default
      t.key = 2.2; t.keyColor.set(0xfff1e0); t.keyPos.set(28, 46, 40)
      t.fill = 0.6; t.fillColor.set(0xdfe8f5)
      t.rim = 0.8; t.env = 1; t.expo = 1; t.tint.set(0xffffff)
    }
  }

  private archCenters(): number[] {
    let cum = 0
    const centers: number[] = []
    for (const t of QUADRANT_TEETH) { centers.push(cum + t.w / 2); cum += t.w }
    return centers
  }
  /** Walk every tooth of the procedural upper arch — shared by the studio arch,
      the auto-fit anchors and the free-mode labelling proxies. */
  private forEachArchTooth(fn: (fdi: string, spec: ToothSpec, pos: THREE.Vector3, outward: THREE.Vector3, tangent: THREE.Vector3) => void) {
    const centers = this.archCenters()
    for (const t of QUADRANT_TEETH) {
      const centerS = centers[QUADRANT_TEETH.indexOf(t)]
      for (const side of [-1, 1] as const) {
        const fdi = side < 0 ? t.fdiR : t.fdiL
        const spec = TOOTH_SPECS[t.key]
        const s = centerS * side
        const x = xForArc(Math.abs(s)) * side
        const z = -(x * x) / ARCH_K
        const outward = new THREE.Vector3((2 * x) / ARCH_K, 0, 1).normalize()
        const tangent = new THREE.Vector3(outward.z, 0, -outward.x)
        const pos = new THREE.Vector3(x, (seeded(fdi, 4) - 0.5) * 0.8, z)
        fn(fdi, spec, pos, outward, tangent)
      }
    }
  }

  private buildDentition() {
    const group = new THREE.Group()
    this.dentitionGroup = group
    const baseEnamel = new THREE.MeshPhysicalMaterial({
      color: 0xf6f0e4, roughness: 0.3, clearcoat: 0.55, clearcoatRoughness: 0.3,
      envMapIntensity: 0.85, emissive: 0xa97d45, emissiveIntensity: 0,
    })
    this.forEachArchTooth((fdi, spec, pos, outward, tangent) => {
      const geo = createToothGeometry(spec)
      const mat = baseEnamel.clone()
      mat.color.offsetHSL((seeded(fdi, 1) - 0.5) * 0.012, (seeded(fdi, 2) - 0.5) * 0.03, (seeded(fdi, 3) - 0.5) * 0.035)
      const mesh = new THREE.Mesh(geo, mat)
      mesh.rotation.order = 'YXZ'
      mesh.rotation.set(THREE.MathUtils.degToRad(spec.procline), Math.atan2(outward.x, outward.z), 0)
      mesh.position.copy(pos)
      mesh.scale.setScalar(1 + (seeded(fdi, 5) - 0.5) * 0.05)
      mesh.castShadow = true; mesh.receiveShadow = true
      mesh.userData.toothId = fdi
      group.add(mesh)
      this.toothMeshes.push(mesh)
      this.archAnchors.set(fdi, { center: pos.clone(), outward: outward.clone(), tangent: tangent.clone() })
      this.toothRigs.set(fdi, {
        id: fdi, mesh, materials: [mat], spec, highlight: 0, imported: false,
        center: pos.clone(), outward: outward.clone(), tangent: tangent.clone(),
      })
    })
    const gum = this.buildGum(this.archCenters())
    gum.castShadow = true; gum.receiveShadow = true
    group.add(gum)
    this.scene.add(group)
    this.scene.updateMatrixWorld(true)
  }

  private buildGum(centers: number[]): THREE.Mesh {
    const hw = 2.65, hh = 3.8, r = 1.8, segs = 6
    const outline: [number, number][] = []
    const corners = [
      [hw - r, hh - r, 0], [-hw + r, hh - r, Math.PI / 2],
      [-hw + r, -hh + r, Math.PI], [hw - r, -hh + r, (3 * Math.PI) / 2],
    ]
    for (const [cx, cy, a0] of corners)
      for (let k = 0; k <= segs; k++) {
        const a = a0 + (k / segs) * (Math.PI / 2)
        outline.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r])
      }
    const M = outline.length
    const AC = -0.5, BC = 4.0
    const S_END = centers[6] + 5.5
    const STATIONS = 150
    const positions: number[] = [], indices: number[] = []
    for (let i = 0; i <= STATIONS; i++) {
      const f = i / STATIONS
      const s = -S_END + f * S_END * 2
      const x = xForArc(Math.abs(s)) * (s < 0 ? -1 : 1)
      const z = -(x * x) / ARCH_K
      const nl = Math.hypot((2 * x) / ARCH_K, 1)
      const nx = (2 * x) / ARCH_K / nl, nz = 1 / nl
      const closeEnd = ss01((Math.abs(s) - (S_END - 3)) / 3)
      const shrink = 0.12 + 0.88 * (1 - closeEnd)
      for (let j = 0; j < M; j++) {
        let a = AC + outline[j][0], b = BC + outline[j][1]
        a = AC + (a - AC) * shrink
        b = BC + (b - BC) * shrink
        positions.push(x + nx * a, b, z + nz * a)
      }
    }
    for (let i = 0; i < STATIONS; i++)
      for (let j = 0; j < M; j++) {
        const j2 = (j + 1) % M
        const a = i * M + j, b = i * M + j2, c = (i + 1) * M + j2, d = (i + 1) * M + j
        indices.push(a, c, d, a, b, c)
      }
    const geo = new THREE.BufferGeometry()
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3))
    geo.setIndex(indices)
    geo.computeVertexNormals()
    const mat = new THREE.MeshPhysicalMaterial({
      color: 0xb96f7a, roughness: 0.42, clearcoat: 0.45, clearcoatRoughness: 0.35,
      envMapIntensity: 0.7, side: THREE.DoubleSide,
    })
    return new THREE.Mesh(geo, mat)
  }

  /* ---------- custom model import (.glb) ---------- */

  private matchToothName(name: string): string | null {
    const m = (name || '').match(/(?:^|[^0-9])(1[1-7]|2[1-7])(?:$|[^0-9])/)
    return m ? m[1] : null
  }
  private removeDentition() {
    if (this.dentitionGroup) {
      this.scene.remove(this.dentitionGroup)
      this.dentitionGroup.traverse((o) => {
        const m = o as THREE.Mesh
        if (m.isMesh) {
          m.geometry?.dispose()
          const mats = Array.isArray(m.material) ? m.material : [m.material]
          mats.forEach((x) => x?.dispose?.())
        }
      })
    }
    this.dentitionGroup = new THREE.Group()
    this.toothRigs.clear()
    this.toothMeshes.length = 0
    // arch anchors are kept: they are the reference frame for GLB classification
  }
  private clearCustomModel() {
    if (this.proxyGroup) {
      this.scene.remove(this.proxyGroup)
      const seen = new Set<THREE.Material>()
      this.proxyGroup.traverse((o) => {
        const m = o as THREE.Mesh
        if (m.isMesh) {
          m.geometry?.dispose()
          const mats = Array.isArray(m.material) ? m.material : [m.material]
          mats.forEach((x) => { if (x && !seen.has(x)) { seen.add(x); x.dispose() } })
        }
      })
      this.proxyGroup = null
    }
    this.proxyMeshes.length = 0
    this.mergedMode = false
  }
  resetToStudioModel() {
    this.cancelPlacing()
    this.clearCustomModel()
    this.removeDentition()
    this.buildDentition()
    this.scene.updateMatrixWorld(true)
    this.syncJewels()
  }
  async importGLB(file: File): Promise<{ teeth: number; mode: 'teeth' | 'free' }> {
    this.cancelPlacing()
    if (this.dragJewel) { this.dragJewel = null; this.dragLastHit = null; this.controls.enabled = true }
    const buffer = await file.arrayBuffer()
    const loader = new GLTFLoader()
    const draco = new DRACOLoader()
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/')
    loader.setDRACOLoader(draco)
    let gltf: { scene: THREE.Group }
    try { gltf = await loader.parseAsync(buffer, '') }
    catch { draco.dispose(); throw new Error('not a valid glTF/GLB file') }
    draco.dispose()
    const root = gltf.scene
    root.updateMatrixWorld(true)

    // --- auto-fit into the studio coordinate system
    let box = new THREE.Box3().setFromObject(root)
    const size = box.getSize(new THREE.Vector3())
    const scale = GLB_FIT.targetWidth / Math.max(size.x, 0.001)
    root.scale.setScalar(scale)
    root.updateMatrixWorld(true)
    box = new THREE.Box3().setFromObject(root)
    const c = box.getCenter(new THREE.Vector3())
    root.position.sub(new THREE.Vector3(c.x - 0, c.y - GLB_FIT.centerY, c.z - GLB_FIT.centerZ))
    root.updateMatrixWorld(true)

    // --- classify every mesh: named tooth / nearest-anchor tooth / scenery
    const meshes: THREE.Mesh[] = []
    root.traverse((o) => { const m = o as THREE.Mesh; if (m.isMesh) meshes.push(m) })
    if (!meshes.length) throw new Error('no meshes found in the file')
    const buckets = new Map<string, THREE.Mesh[]>()
    const push = (fdi: string, m: THREE.Mesh) => {
      const arr = buckets.get(fdi)
      if (arr) arr.push(m); else buckets.set(fdi, [m])
    }
    for (const m of meshes) {
      m.castShadow = true; m.receiveShadow = true
      const byName = this.matchToothName(m.name)
      if (byName) { push(byName, m); continue }
      if (/gum|gingiva|gencive|muqueuse|palais|base|floor|plane|camera/i.test(m.name || '')) continue
      const b = new THREE.Box3().setFromObject(m)
      const ms = b.getSize(new THREE.Vector3())
      if (Math.max(ms.x, ms.y, ms.z) > GLB_FIT.maxToothSize) continue
      const center = b.getCenter(new THREE.Vector3())
      let best: string | null = null, bestD = GLB_FIT.snapRadius
      this.archAnchors.forEach((a, fdi) => { const d = a.center.distanceTo(center); if (d < bestD) { bestD = d; best = fdi } })
      if (best) push(best, m)
    }

    // --- swap the procedural dentition for the imported one (never rejected)
    this.clearCustomModel()
    this.removeDentition()
    this.dentitionGroup = root
    this.scene.add(root)

    if (buckets.size >= 4) {
      /* TOOTH MODE — separate tooth meshes detected: exact per-tooth selection. */
      for (const [fdi, list] of buckets) {
        const group = new THREE.Group()
        group.userData.toothId = fdi
        root.add(group)
        list.forEach((m) => group.attach(m)) // keeps world transforms
        // clone materials per tooth so hover/selection highlights don't bleed
        const mats: THREE.MeshPhysicalMaterial[] = []
        group.traverse((o) => {
          const mm = o as THREE.Mesh
          if (!mm.isMesh) return
          const src = Array.isArray(mm.material) ? mm.material : [mm.material]
          const cloned = src.map((mat) => {
            const c2 = mat.clone() as THREE.MeshPhysicalMaterial
            if ((c2 as unknown as { emissive?: THREE.Color }).emissive) {
              c2.emissive = new THREE.Color(0xa97d45)
              c2.emissiveIntensity = 0
              mats.push(c2)
            }
            return c2
          })
          mm.material = Array.isArray(mm.material) ? cloned : cloned[0]
        })
        const bbox = new THREE.Box3().setFromObject(group)
        const bs = bbox.getSize(new THREE.Vector3())
        const anchor = this.archAnchors.get(fdi)!
        this.toothRigs.set(fdi, {
          id: fdi, mesh: group, materials: mats, imported: true, highlight: 0,
          spec: {
            wHalf: Math.max(bs.x / 2, 1), hHalf: Math.max(bs.y / 2, 1),
            dHalf: Math.max(bs.z / 2, 1), p: 5, cervical: 0.2, procline: 0,
          },
          center: bbox.getCenter(new THREE.Vector3()),
          outward: anchor.outward.clone(), tangent: anchor.tangent.clone(),
        })
        this.toothMeshes.push(group)
      }
      this.scene.updateMatrixWorld(true)
      this.syncJewels()
      return { teeth: buckets.size, mode: 'teeth' }
    }

    /* FREE MODE — merged model: every surface is placeable, jewels raycast the
       real geometry for exact position + orientation. Tooth labels are inferred
       from invisible reference teeth placed along the standard arch. */
    this.mergedMode = true
    this.toothMeshes.push(root)
    const proxyMat = new THREE.MeshBasicMaterial({ visible: false }) // rendered never, raycast always
    const proxyGroup = new THREE.Group()
    this.forEachArchTooth((fdi, spec, pos, outward, tangent) => {
      const m = new THREE.Mesh(createToothGeometry(spec), proxyMat)
      m.position.copy(pos)
      m.rotation.order = 'YXZ'
      m.rotation.set(THREE.MathUtils.degToRad(spec.procline), Math.atan2(outward.x, outward.z), 0)
      m.userData.toothId = fdi
      proxyGroup.add(m)
      this.proxyMeshes.push(m)
      this.toothRigs.set(fdi, {
        id: fdi, mesh: root, materials: [], spec, imported: true, highlight: 0,
        center: pos.clone(), outward: outward.clone(), tangent: tangent.clone(),
      })
    })
    this.proxyGroup = proxyGroup
    this.scene.add(proxyGroup)
    this.scene.updateMatrixWorld(true)
    this.syncJewels()
    return { teeth: 0, mode: 'free' }
  }

  /* ---------- raycasting (JewelryPlacementController) ---------- */

  private setNDC(e: { clientX: number; clientY: number }) {
    const r = this.renderer.domElement.getBoundingClientRect()
    this.raycaster.setFromCamera(
      new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1),
      this.camera)
  }
  /** Free-mode labelling: which tooth does the current pointer ray point at? */
  private classifyHit(point: THREE.Vector3): string {
    const ph = this.raycaster.intersectObjects(this.proxyMeshes, false)
    if (ph.length) return ph[0].object.userData.toothId as string
    // fallback: nearest arch anchor to the surface point (vertical distance damped)
    let best = FREE_TOOTH, bestD = 30
    this.toothRigs.forEach((rig, fdi) => {
      const dx = rig.center.x - point.x
      const dy = (rig.center.y - point.y) * 0.4
      const dz = rig.center.z - point.z
      const d = Math.hypot(dx, dy, dz)
      if (d < bestD) { bestD = d; best = fdi }
    })
    return best
  }
  private raycastTeeth(): SurfaceHit | null {
    const hits = this.raycaster.intersectObjects(this.toothMeshes, true)
    if (!hits.length) return null
    const h = hits[0]
    const n = geometricWorldNormal(h, this.raycaster.ray.direction).clone()
    const toothId = this.mergedMode ? this.classifyHit(h.point) : toothIdFromObject(h.object)
    if (!toothId) return null
    return { toothId, point: h.point.clone(), normal: n }
  }
  private raycastJewels(): { jewelId: string } | null {
    if (!this.jewelMeshes.length) return null
    const hits = this.raycaster.intersectObjects(this.jewelMeshes, false)
    if (!hits.length) return null
    return { jewelId: hits[0].object.userData.jewelId as string }
  }
  /** Re-snap an arbitrary world point onto the nearest tooth surface along `nrm`.
       Used by mirroring, layout tools and collision search — tries both directions. */
  private snapToSurface(point: THREE.Vector3, nrm: THREE.Vector3): SurfaceHit | null {
    const n = nrm.clone().normalize()
    const tries: [THREE.Vector3, THREE.Vector3][] = [
      [point.clone().addScaledVector(n, 6), n.clone().negate()],
      [point.clone().addScaledVector(n, -6), n.clone()],
    ]
    for (const [origin, dir] of tries) {
      this.raycaster.set(origin, dir)
      this.raycaster.far = 80
      const hits = this.raycaster.intersectObjects(this.toothMeshes, true)
      this.raycaster.far = Infinity
      if (hits.length) {
        const h = hits[0]
        const gn = geometricWorldNormal(h, dir).clone()
        const toothId = this.mergedMode ? this.classifyHit(h.point) : toothIdFromObject(h.object)
        if (toothId) return { toothId, point: h.point.clone(), normal: gn }
      }
    }
    return null
  }
  /** Nearest tooth rig to a world point (fallback for unlabeled free-mode pieces). */
  private nearestRig(p: THREE.Vector3): ToothRig | null {
    let best: ToothRig | null = null, bestD = Infinity
    this.toothRigs.forEach((r) => { const d = r.center.distanceTo(p); if (d < bestD) { bestD = d; best = r } })
    return best
  }

  /* ---------- collision system: pieces may touch, never overlap ---------- */

  /** Visual centre of a piece (surface point pushed out along its normal). */
  private gemCenterRaw(point: THREE.Vector3, normal: THREE.Vector3, typeId: string, scale: number, offset: number): THREE.Vector3 {
    const tpl = getJewelTemplate(JEWELRY_BY_ID[typeId].geometry)
    return point.clone().addScaledVector(normal.clone().normalize(), tpl.halfDepth * scale + mountGap(scale, offset))
  }
  private jewelCenter(j: PlacedJewelry): THREE.Vector3 {
    return this.gemCenterRaw(
      new THREE.Vector3(j.position.x, j.position.y, j.position.z),
      new THREE.Vector3(j.normal.x, j.normal.y, j.normal.z),
      j.jewelryTypeId, j.scale, j.offset ?? 0)
  }
  private jewelRadius(j: { jewelryTypeId: string; scale: number }): number {
    return getJewelTemplate(JEWELRY_BY_ID[j.jewelryTypeId].geometry).radius * j.scale
  }
  /** Every placed piece except `exceptIds`, as collision blockers. */
  private blockersFor(exceptIds: Set<string>): { center: THREE.Vector3; radius: number }[] {
    const out: { center: THREE.Vector3; radius: number }[] = []
    for (const j of this.store.jewels) {
      if (exceptIds.has(j.id)) continue
      out.push({ center: this.jewelCenter(j), radius: this.jewelRadius(j) })
    }
    return out
  }
  /** Does a candidate pose collide with any blocker? Contact (edges touching) is allowed. */
  private hitBlocked(hit: SurfaceHit, typeId: string, scale: number, offset: number,
    blockers: { center: THREE.Vector3; radius: number }[]): boolean {
    const c = this.gemCenterRaw(hit.point, hit.normal, typeId, scale, offset)
    const r = this.jewelRadius({ jewelryTypeId: typeId, scale })
    return blockers.some((b) => b.center.distanceTo(c) < b.radius + r - CONTACT_TOL)
  }
  /** The proposed spot, or the nearest free spot on the enamel around it
      (spiral search in the tangent plane, re-snapped by raycast). Null = no room. */
  private findFreeSpot(startHit: SurfaceHit, typeId: string, scale: number, offset: number,
    blockers: { center: THREE.Vector3; radius: number }[]): SurfaceHit | null {
    if (!this.hitBlocked(startHit, typeId, scale, offset, blockers)) return startHit
    const n = startHit.normal.clone().normalize()
    const t = new THREE.Vector3(-n.z, 0, n.x)
    if (t.lengthSq() < 1e-6) t.set(1, 0, 0)
    t.normalize()
    const u = new THREE.Vector3().crossVectors(t, n).normalize()
    for (let step = 0.9; step <= 4.2; step += 0.9) {
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2
        const cand = startHit.point.clone()
          .addScaledVector(t, Math.cos(a) * step)
          .addScaledVector(u, Math.sin(a) * step)
        const snapped = this.snapToSurface(cand, n)
        if (!snapped) continue
        if (!this.hitBlocked(snapped, typeId, scale, offset, blockers)) return snapped
      }
    }
    return null
  }
  /** Collision check for a fresh library placement at its default size. */
  private placementBlocked(hit: SurfaceHit, typeId: string): boolean {
    const def = JEWELRY_BY_ID[typeId]
    return this.hitBlocked(hit, typeId, def.defaultScale, 0, this.blockersFor(new Set()))
  }
  /** Collision-aware duplication: each copy slides to the nearest free spot. */
  duplicateSelection(ids: string[]): number {
    const srcs = this.store.jewels.filter((j) => ids.includes(j.id))
    if (!srcs.length) return 0
    const blockers = this.blockersFor(new Set()) // every existing piece blocks the copies
    const copies: PlacedJewelry[] = []
    for (const src of srcs) {
      const nrm = new THREE.Vector3(src.normal.x, src.normal.y, src.normal.z).normalize()
      const tDir = new THREE.Vector3(-nrm.z, 0, n.x)
      if (tDir.lengthSq() < 1e-6) tDir.set(1, 0, 0)
      tDir.normalize()
      const nudged = new THREE.Vector3(src.position.x, src.position.y, src.position.z).addScaledVector(tDir, 1.4)
      const startHit = this.snapToSurface(nudged, nrm)
        ?? { toothId: src.toothId, point: new THREE.Vector3(src.position.x, src.position.y, src.position.z), normal: nrm }
      const free = this.findFreeSpot(startHit, src.jewelryTypeId, src.scale, src.offset ?? 0, blockers)
      if (!free) continue // no room for this copy
      const copy: PlacedJewelry = {
        ...src, id: uid(), toothId: free.toothId,
        position: v3(free.point.x, free.point.y, free.point.z),
        normal: v3(free.normal.x, free.normal.y, free.normal.z),
      }
      copies.push(copy)
      blockers.push({ center: this.jewelCenter(copy), radius: this.jewelRadius(src) })
    }
    return this.store.insertJewels(copies)
  }
  /** Move one piece to a tooth (inspector dropdown) — slides to a free spot. */
  relocateJewelToTooth(id: string, toothId: string): boolean {
    const j = this.store.jewels.find((x) => x.id === id)
    if (!j) return false
    const anchor = this.getSurfacePoint(toothId, 0, 0)
    const blockers = this.blockersFor(new Set([id]))
    const free = this.findFreeSpot(anchor, j.jewelryTypeId, j.scale, j.offset ?? 0, blockers)
    if (!free) return false
    this.store.pushHistory()
    this.store.updateJewel(id, {
      toothId: free.toothId,
      position: v3(free.point.x, free.point.y, free.point.z),
      normal: v3(free.normal.x, free.normal.y, free.normal.z),
    })
    return true
  }

  /* ---------- layout operations (collision-aware) ---------- */

  /** Mirror the current selection. 'h' = across the arch midline (x = 0),
       'v' = around the selection's vertical centre. One undo step. */
  mirrorSelection(axis: 'h' | 'v'): MoveResult | null {
    const ids = [...this.store.getSnapshot().selectedJewelIds]
    const affected = this.store.jewels.filter((j) => ids.includes(j.id))
    if (!affected.length) return null
    const planeY = axis === 'v'
      ? affected.reduce((s, j) => s + j.position.y, 0) / affected.length
      : 0
    const blockers = this.blockersFor(new Set(ids))
    const updates: { id: string; patch: Partial<PlacedJewelry> }[] = []
    let skipped = 0
    for (const j of affected) {
      const p = new THREE.Vector3(j.position.x, j.position.y, j.position.z)
      const nrm = new THREE.Vector3(j.normal.x, j.normal.y, j.normal.z).normalize()
      const mp = axis === 'h'
        ? new THREE.Vector3(-p.x, p.y, p.z)
        : new THREE.Vector3(p.x, 2 * planeY - p.y, p.z)
      const mn = axis === 'h'
        ? new THREE.Vector3(-nrm.x, nrm.y, nrm.z)
        : new THREE.Vector3(nrm.x, -nrm.y, nrm.z)
      const rotation = Math.round((360 - (j.rotation % 360)) % 360)
      const snapped = this.snapToSurface(mp, mn)
      const proposed: SurfaceHit = snapped ?? { toothId: j.toothId, point: mp, normal: mn }
      const free = this.findFreeSpot(proposed, j.jewelryTypeId, j.scale, j.offset ?? 0, blockers)
      if (!free) { skipped++; continue }
      updates.push({
        id: j.id, patch: {
          toothId: free.toothId,
          position: v3(free.point.x, free.point.y, free.point.z),
          normal: v3(free.normal.x, free.normal.y, free.normal.z),
          rotation } })
      blockers.push({ center: this.gemCenterRaw(free.point, free.normal, j.jewelryTypeId, j.scale, j.offset ?? 0), radius: this.jewelRadius(j) })
    }
    if (!updates.length) return { moved: 0, skipped }
    this.store.pushHistory()
    this.store.applyPatches(updates)
    return { moved: updates.length, skipped }
  }
  /** Distribute the selected pieces evenly between the two outermost ones,
       moving each along the arch tangent and re-snapping onto the enamel. */
  distributeSelectionAlongArch(): MoveResult | null {
    const ids = [...this.store.getSnapshot().selectedJewelIds]
    const gems = this.store.jewels.filter((j) => ids.includes(j.id))
    if (gems.length < 3) return null
    const centers = this.archCenters()
    const keyed = gems.map((j) => {
      const p = new THREE.Vector3(j.position.x, j.position.y, j.position.z)
      const rig = this.toothRigs.get(j.toothId) ?? this.nearestRig(p)
      let key = p.x, tangent = new THREE.Vector3(1, 0, 0)
      if (rig) {
        const idx = parseInt(rig.id[1], 10) - 1
        const side = rig.id[0] === '1' ? -1 : 1
        key = centers[idx] * side + p.clone().sub(rig.center).dot(rig.tangent)
        tangent = rig.tangent
      }
      return { j, key, tangent }
    }).sort((a, b) => a.key - b.key)
    const k0 = keyed[0].key, k1 = keyed[keyed.length - 1].key
    if (k1 - k0 < 0.01) return null
    // the two outermost pieces stay fixed and block; only the middles move
    const blockers = this.blockersFor(new Set(keyed.slice(1, -1).map((k) => k.j.id)))
    const updates: { id: string; patch: Partial<PlacedJewelry> }[] = []
    let skipped = 0
    keyed.forEach((k, i) => {
      if (i === 0 || i === keyed.length - 1) return
      const target = k0 + (k1 - k0) * (i / (keyed.length - 1))
      const moved = new THREE.Vector3(k.j.position.x, k.j.position.y, k.j.position.z)
        .addScaledVector(k.tangent, target - k.key)
      const nrm = new THREE.Vector3(k.j.normal.x, k.j.normal.y, k.j.normal.z)
      const snapped = this.snapToSurface(moved, nrm)
      if (!snapped) { skipped++; return }
      const free = this.findFreeSpot(snapped, k.j.jewelryTypeId, k.j.scale, k.j.offset ?? 0, blockers)
      if (!free) { skipped++; return }
      updates.push({
        id: k.j.id, patch: {
          toothId: free.toothId,
          position: v3(free.point.x, free.point.y, free.point.z),
          normal: v3(free.normal.x, free.normal.y, free.normal.z),
        } })
      blockers.push({ center: this.gemCenterRaw(free.point, free.normal, k.j.jewelryTypeId, k.j.scale, k.j.offset ?? 0), radius: this.jewelRadius(k.j) })
    })
    if (!updates.length) return { moved: 0, skipped }
    this.store.pushHistory()
    this.store.applyPatches(updates)
    return { moved: updates.length, skipped }
  }
  /** Set every selected piece to the crown equator of its tooth, keeping its
       across-position (u) on that tooth. */
  alignSelectionAtEquator(): MoveResult | null {
    const ids = [...this.store.getSnapshot().selectedJewelIds]
    const gems = this.store.jewels.filter((j) => ids.includes(j.id))
    if (!gems.length) return null
    const blockers = this.blockersFor(new Set(ids))
    const updates: { id: string; patch: Partial<PlacedJewelry> }[] = []
    let skipped = 0
    for (const j of gems) {
      const p = new THREE.Vector3(j.position.x, j.position.y, j.position.z)
      const rig = this.toothRigs.get(j.toothId) ?? this.nearestRig(p)
      if (!rig) { skipped++; continue }
      const tOff = p.clone().sub(rig.center).dot(rig.tangent)
      const u = clamp(tOff / (rig.spec.wHalf * 0.6), -1, 1)
      const anchor = this.getSurfacePoint(rig.id, u, 0)
      const free = this.findFreeSpot(anchor, j.jewelryTypeId, j.scale, j.offset ?? 0, blockers)
      if (!free) { skipped++; continue }
      updates.push({
        id: j.id, patch: {
          toothId: free.toothId,
          position: v3(free.point.x, free.point.y, free.point.z),
          normal: v3(free.normal.x, free.normal.y, free.normal.z),
        } })
      blockers.push({ center: this.gemCenterRaw(free.point, free.normal, j.jewelryTypeId, j.scale, j.offset ?? 0), radius: this.jewelRadius(j) })
    }
    if (!updates.length) return { moved: 0, skipped }
    this.store.pushHistory()
    this.store.applyPatches(updates)
    return { moved: updates.length, skipped }
  }
  /** Anchor point on a tooth's labial face (u: -1..1 across, v: -1..1 vertical), refined by raycast. */
  getSurfacePoint(toothId: string, u: number, v: number): SurfaceHit {
    const rig = this.toothRigs.get(toothId)!
    const spec = rig.spec
    let origin: THREE.Vector3, dir: THREE.Vector3
    if (rig.imported) {
      origin = rig.center.clone()
        .addScaledVector(rig.tangent, u * spec.wHalf * 0.6)
        .addScaledVector(_UP, v * spec.hHalf * 0.55)
        .addScaledVector(rig.outward, spec.dHalf * 2 + 6)
      dir = rig.outward.clone().negate()
    } else {
      const local = new THREE.Vector3(u * spec.wHalf * 0.6, v * spec.hHalf * 0.5, spec.dHalf * 2.5)
      origin = rig.mesh.localToWorld(local.clone())
      dir = new THREE.Vector3(0, 0, 1).applyQuaternion(rig.mesh.getWorldQuaternion(_q3)).normalize().negate()
    }
    this.raycaster.set(origin, dir)
    this.raycaster.far = 80
    const hits = this.raycaster.intersectObject(rig.mesh, true)
    this.raycaster.far = Infinity
    if (hits.length) {
      const h = hits[0]
      const n = geometricWorldNormal(h, dir).clone()
      return { toothId, point: h.point.clone(), normal: n }
    }
    return { toothId, point: origin.clone().addScaledVector(dir, spec.dHalf * 2), normal: dir.clone().negate() }
  }
  /** Human-readable surface location ("Middle third · labial surface") — works for all models. */
  describeSurface(j: PlacedJewelry): string {
    const rig = this.toothRigs.get(j.toothId)
    if (!rig) return ''
    const rel = new THREE.Vector3(j.position.x, j.position.y, j.position.z).sub(rig.center)
    const ty = rel.y / rig.spec.hHalf
    const third = ty < -0.33 ? 'Incisal third' : ty > 0.33 ? 'Cervical third' : 'Middle third'
    const n = new THREE.Vector3(j.normal.x, j.normal.y, j.normal.z)
    const dOut = n.dot(rig.outward), dUp = n.y
    const face = dOut > 0.45 ? 'labial surface' : dOut < -0.45 ? 'palatal surface'
      : dUp < -0.5 ? 'incisal edge' : dUp > 0.5 ? 'cervical surface' : 'proximal surface'
    return `${third} · ${face}`
  }

  /* ---------- jewel pose & rigs ---------- */

  private poseObject(obj: THREE.Object3D, point: THREE.Vector3, normal: THREE.Vector3, rotationDeg: number, halfDepth: number, scale: number, manualOffset = 0) {
    _nn.copy(normal).normalize()
    _q1.setFromUnitVectors(_Z, _nn)
    _q2.setFromAxisAngle(_Z, THREE.MathUtils.degToRad(rotationDeg))
    obj.quaternion.copy(_q1).multiply(_q2)
    obj.position.copy(point).addScaledVector(_nn, halfDepth * scale + mountGap(scale, manualOffset))
  }
  private applyPose(group: THREE.Group, j: PlacedJewelry, halfDepth: number) {
    _p.set(j.position.x, j.position.y, j.position.z)
    _n.set(j.normal.x, j.normal.y, j.normal.z)
    this.poseObject(group, _p, _n, j.rotation, halfDepth, j.scale, j.offset ?? 0)
  }
  private buildRigContent(rig: JewelRig, j: PlacedJewelry) {
    this.unregisterMeshes(rig)
    rig.content.clear(); rig.outline.clear()
    const def = JEWELRY_BY_ID[j.jewelryTypeId]
    const tpl = getJewelTemplate(def.geometry)
    const material = getJewelMaterial(j) // shared, cached — never disposed per rig
    rig.meshes = tpl.parts.map((g) => {
      const m = new THREE.Mesh(g, material)
      m.castShadow = true
      m.userData.jewelId = rig.id
      rig.content.add(m)
      return m
    })
    const outline = rig.content.clone(true)
    outline.traverse((o) => {
      const m = o as THREE.Mesh
      if (m.isMesh) { m.material = rig.outlineMaterial; m.castShadow = false; (m as unknown as { raycast: () => void }).raycast = () => {} }
    })
    outline.scale.setScalar(1.16)
    rig.outline.add(outline)
    rig.material = material; rig.matKey = matKeyFor(j); rig.typeId = j.jewelryTypeId
    rig.halfDepth = tpl.halfDepth; rig.radius = tpl.radius
    this.jewelMeshes.push(...rig.meshes)
  }
  private createJewelRig(j: PlacedJewelry): JewelRig {
    const rig: JewelRig = {
      id: j.id, group: new THREE.Group(), content: new THREE.Group(), outline: new THREE.Group(), meshes: [],
      material: null, outlineMaterial: new THREE.MeshBasicMaterial({
        color: OUTLINE_COLOR, side: THREE.BackSide, transparent: true, opacity: 0 }),
      typeId: '', matKey: '', halfDepth: 0.5, radius: 0.8, sizeScale: 1, birth: 0, death: 0, hoverT: 0,
    }
    rig.group.add(rig.content, rig.outline)
    this.buildRigContent(rig, j)
    return rig
  }
  private unregisterMeshes(rig: JewelRig) {
    this.jewelMeshes = this.jewelMeshes.filter((m) => m.userData.jewelId !== rig.id)
  }
  private syncJewels = () => {
    const jewels = this.store.jewels
    const seen = new Set<string>()
    for (const j of jewels) {
      seen.add(j.id)
      let rig = this.jewelRigs.get(j.id)
      const mk = matKeyFor(j)
      if (!rig) {
        rig = this.createJewelRig(j)
        this.jewelRigs.set(j.id, rig)
        this.jewelsGroup.add(rig.group)
        rig.birth = performance.now()
      } else if (rig.typeId !== j.jewelryTypeId) {
        this.buildRigContent(rig, j)
      } else if (rig.matKey !== mk) {
        const material = getJewelMaterial(j)
        rig.meshes.forEach((m) => { m.material = material })
        rig.material = material; rig.matKey = mk
      }
      rig.sizeScale = j.scale
      if (this.dragJewel !== rig) this.applyPose(rig.group, j, rig.halfDepth)
    }
    for (const [id, rig] of Array.from(this.jewelRigs)) {
      if (!seen.has(id)) {
        this.jewelRigs.delete(id)
        this.unregisterMeshes(rig)
        rig.death = performance.now()
        this.dyingJewels.push(rig)
      }
    }
  }
  private onStoreChange = () => { this.syncJewels() }

  /* ---------- input ---------- */

  private onPointerDown = (e: PointerEvent) => {
    if (this.placing) return
    if (this.camTween) { this.camTween = null; this.controls.enabled = true; this.controls.update() }
    if (e.button !== 0) { this.press = null; this.mode = 'idle'; return }
    this.setNDC(e)
    const jHit = this.raycastJewels()
    if (jHit) {
      e.stopPropagation() // pre-empt OrbitControls: this press belongs to the jewel
      this.controls.enabled = false
      this.mode = 'jewel-press'
      this.press = { jewelId: jHit.jewelId, x: e.clientX, y: e.clientY, t: performance.now() }
      return
    }
    const tHit = this.raycastTeeth()
    if (tHit && this.store.getSnapshot().armedTypeId) {
      e.stopPropagation()
      this.controls.enabled = false
      this.mode = 'armed-press'
      this.press = { toothId: tHit.toothId, x: e.clientX, y: e.clientY, t: performance.now() }
      return
    }
    this.mode = tHit ? 'tooth-press' : 'bg-press'
    this.press = { toothId: tHit?.toothId, x: e.clientX, y: e.clientY, t: performance.now() }
  }

  private onPointerMove = (e: PointerEvent) => {
    if (this.placing) { this.updatePlacing(e); return }
    if (!this.press) { this.updateHover(e); return }
    const moved = Math.hypot(e.clientX - this.press.x, e.clientY - this.press.y) > 5
    if (this.mode === 'jewel-press' && moved) {
      const rig = this.jewelRigs.get(this.press.jewelId!)
      if (rig) {
        this.store.pushHistory()
        this.dragJewel = rig
        this.dragLastHit = null
        this.mode = 'drag-jewel'
        this.store.selectJewel(rig.id) // dragging always operates on a single piece
      } else this.mode = 'idle'
    }
    if (this.mode === 'drag-jewel') {
      this.setNDC(e)
      const hit = this.raycastTeeth()
      let blocked = false
      if (hit) {
        this.setHoverTooth(hit.toothId)
        const j = this.store.jewels.find((x) => x.id === this.dragJewel!.id)
        if (j) {
          // the piece can never enter another piece — it holds at the last
          // free position while the cursor is over an occupied spot
          blocked = this.hitBlocked(hit, j.jewelryTypeId, j.scale, j.offset ?? 0, this.blockersFor(new Set([j.id])))
          if (!blocked) {
            this.dragLastHit = hit
            this.poseObject(this.dragJewel.group, hit.point, hit.normal, j.rotation, this.dragJewel.halfDepth, j.scale, j.offset ?? 0)
          }
        }
      }
      this.setCursor(blocked ? 'not-allowed' : 'grabbing')
      return
    }
    if (this.mode === 'bg-press' && moved) { this.clearHover(); this.setCursor('grabbing'); return }
    if (this.mode === 'tooth-press' && moved) { this.clearHover(); this.setCursor('grabbing'); return }
  }

  private onPointerUp = (e: PointerEvent) => {
    if (this.placing) { this.finishPlacing(e); return }
    const quick = !!this.press &&
      Math.hypot(e.clientX - this.press.x, e.clientY - this.press.y) < 6 &&
      performance.now() - this.press.t < 450
    if (this.mode === 'drag-jewel' && this.dragJewel) {
      if (this.dragLastHit) {
        const hit = this.dragLastHit // last collision-free pose
        this.store.updateJewel(this.dragJewel.id, {
          toothId: hit.toothId, position: v3(hit.point.x, hit.point.y, hit.point.z),
          normal: v3(hit.normal.x, hit.normal.y, hit.normal.z) })
      }
      this.dragJewel = null; this.dragLastHit = null
    } else if (this.mode === 'jewel-press' && quick && this.press?.jewelId) {
      // Shift/Ctrl-click toggles the piece into/out of the multi-selection
      this.store.selectJewel(this.press.jewelId, { toggle: e.shiftKey || e.ctrlKey || e.metaKey })
    } else if (this.mode === 'armed-press' && quick) {
      this.setNDC(e)
      const hit = this.raycastTeeth()
      if (hit) this.placeJewel(this.store.getSnapshot().armedTypeId!, hit)
    } else if (this.mode === 'tooth-press' && quick && this.press?.toothId) {
      this.store.selectTooth(this.press.toothId)
    } else if (this.mode === 'bg-press' && quick) {
      this.store.deselect()
    }
    this.press = null
    this.mode = 'idle'
    this.controls.enabled = !this.camTween
    this.updateHover(e)
  }

  /** Right-click on a piece → context menu. Empty right-clicks fall through
      to OrbitControls (pan) as before. */
  private onContextMenu = (e: MouseEvent) => {
    if (e.target !== this.renderer.domElement) return
    if (this.placing) { this.cancelPlacing(); e.preventDefault(); return }
    this.setNDC(e)
    const jHit = this.raycastJewels()
    if (!jHit) return // no piece under the cursor — keep OrbitControls' pan behaviour
    e.preventDefault()
    const sel = this.store.getSnapshot().selectedJewelIds
    if (!(sel.includes(jHit.jewelId) && sel.length > 1)) this.store.selectJewel(jHit.jewelId)
    const r = this.container.getBoundingClientRect()
    this.store.openContextMenu(jHit.jewelId, e.clientX - r.left, e.clientY - r.top)
  }

  private onBlur = () => { if (this.placing) this.cancelPlacing() }

  private updateHover(e: PointerEvent) {
    const overCanvas = e.target instanceof Node && this.container.contains(e.target)
    if (!overCanvas) { this.clearHover(); return }
    this.setNDC(e)
    const jHit = this.raycastJewels()
    if (jHit) {
      this.hoverJewelId = jHit.jewelId
      this.setHoverTooth(null)
      this.setCursor('grab')
      return
    }
    this.hoverJewelId = null
    const tHit = this.raycastTeeth()
    if (tHit) { this.setHoverTooth(tHit.toothId); this.setCursor(this.store.getSnapshot().armedTypeId ? 'crosshair' : 'pointer') }
    else { this.setHoverTooth(null); this.setCursor(this.store.getSnapshot().armedTypeId ? 'crosshair' : 'grab') }
  }
  private clearHover() { this.hoverJewelId = null; this.setHoverTooth(null) }
  private setHoverTooth(id: string | null) {
    if (this.hoverToothId !== id) { this.hoverToothId = id; this.store.setHoveredTooth(id) }
  }
  private setCursor(css: string) { this.renderer.domElement.style.cursor = css }

  /* ---------- library placement (drag from panel / armed click) ---------- */

  beginPlacing(typeId: string, e: { clientX: number; clientY: number; preventDefault: () => void }) {
    if (this.placing) return
    e.preventDefault()
    this.placing = { typeId, startX: e.clientX, startY: e.clientY, started: false }
  }
  private updatePlacing(e: PointerEvent) {
    const p = this.placing!
    if (!p.started) {
      if (Math.hypot(e.clientX - p.startX, e.clientY - p.startY) > 6) {
        p.started = true
        this.store.setPlacing(p.typeId)
        this.createGhost(p.typeId)
      } else return
    }
    const overCanvas = e.target instanceof Node && this.container.contains(e.target)
    if (!overCanvas) {
      if (this.ghost) this.ghost.root.visible = this.ghost.ringRoot.visible = false
      this.setHoverTooth(null)
      return
    }
    this.setNDC(e)
    const hit = this.raycastTeeth()
    if (hit) {
      const g = this.ghost!
      g.root.visible = g.ringRoot.visible = true
      this.poseObject(g.root, hit.point, hit.normal, 0, g.halfDepth, JEWELRY_BY_ID[p.typeId].defaultScale, 0)
      g.ringRoot.position.copy(hit.point)
      _q1.setFromUnitVectors(_Z, _nn.copy(hit.normal).normalize())
      g.ringRoot.quaternion.copy(_q1)
      // live collision feedback: the ghost turns red over an occupied spot
      const blocked = this.placementBlocked(hit, p.typeId)
      g.material.color.setHex(blocked ? BLOCK_COLOR : g.baseColor)
      g.material.opacity = blocked ? 0.4 : 0.55
      g.ringMaterial.color.setHex(blocked ? BLOCK_COLOR : OUTLINE_COLOR)
      this.setHoverTooth(hit.toothId)
      this.setCursor(blocked ? 'not-allowed' : 'grabbing')
    } else {
      if (this.ghost) this.ghost.root.visible = this.ghost.ringRoot.visible = false
      this.setHoverTooth(null)
      this.setCursor('not-allowed')
    }
  }
  private finishPlacing(e: PointerEvent) {
    const p = this.placing!
    if (p.started) {
      const overCanvas = e.target instanceof Node && this.container.contains(e.target)
      let hit: SurfaceHit | null = null
      if (overCanvas) { this.setNDC(e); hit = this.raycastTeeth() }
      if (hit) this.placeJewel(p.typeId, hit)
      this.destroyGhost()
      this.store.setPlacing(null)
    } else {
      this.store.setArmed(this.store.getSnapshot().armedTypeId === p.typeId ? null : p.typeId)
    }
    this.placing = null
  }
  cancelPlacing() {
    if (!this.placing) return
    if (this.placing.started) { this.destroyGhost(); this.store.setPlacing(null) }
    this.placing = null
  }
  private placeJewel(typeId: string, hit: SurfaceHit) {
    if (this.placementBlocked(hit, typeId)) {
      toast('That spot overlaps a piece — pick a free spot')
      return
    }
    this.store.addJewel(typeId, hit.toothId, v3(hit.point.x, hit.point.y, hit.point.z), v3(hit.normal.x, hit.normal.y, hit.normal.z))
  }
  private createGhost(typeId: string) {
    const def = JEWELRY_BY_ID[typeId]
    const tpl = getJewelTemplate(def.geometry)
    const spec = resolveFinishRaw(def.defaultColor)
    const baseColor = new THREE.Color(spec.hex).getHex()
    const material = new THREE.MeshBasicMaterial({ color: baseColor, transparent: true, opacity: 0.55, depthWrite: false })
    const root = new THREE.Group()
    tpl.parts.forEach((g) => { const m = new THREE.Mesh(g, material); root.add(m) })
    const ringRoot = new THREE.Group()
    const ringMaterial = new THREE.MeshBasicMaterial({ color: OUTLINE_COLOR, transparent: true, opacity: 0.6, depthWrite: false, side: THREE.DoubleSide })
    const ring = new THREE.Mesh(GHOST_RING_GEO, ringMaterial)
    ringRoot.add(ring)
    root.visible = ringRoot.visible = false
    this.scene.add(root, ringRoot)
    this.ghost = { root, ringRoot, ring, ringScale: tpl.radius * def.defaultScale * 1.4, halfDepth: tpl.halfDepth, material, ringMaterial, baseColor }
  }
  private destroyGhost() {
    if (!this.ghost) return
    this.scene.remove(this.ghost.root, this.ghost.ringRoot)
    this.ghost.material.dispose()
    this.ghost.ringMaterial.dispose()
    this.ghost = null
  }

  /* ---------- camera rig ---------- */

  tweenCamera(pos: THREE.Vector3, target: THREE.Vector3, dur = 700) {
    this.camTween = {
      p0: this.camera.position.clone(), p1: pos.clone(),
      t0: this.controls.target.clone(), t1: target.clone(),
      start: performance.now(), dur,
    }
    this.controls.enabled = false
  }
  setView(view: 'front' | 'top' | 'side' | 'reset') {
    const target = new THREE.Vector3(0, 0.5, -6)
    const pos = view === 'front' ? new THREE.Vector3(0, 4, 56)
      : view === 'top' ? new THREE.Vector3(0.01, 66, 6)
      : view === 'side' ? new THREE.Vector3(64, 4, -8)
      : new THREE.Vector3(0, 9, 66)
    if (view === 'reset') this.setAutoRotate(false)
    this.tweenCamera(pos, target, 750)
  }
  focusTooth(toothId: string) {
    const rig = this.toothRigs.get(toothId)
    if (!rig) return
    const c = rig.center.clone()
    const dir = this.camera.position.clone().sub(this.controls.target).normalize()
    this.tweenCamera(c.clone().addScaledVector(dir, 30), c, 650)
  }
  zoomBy(f: number) {
    const t = this.controls.target.clone()
    const dir = this.camera.position.clone().sub(t)
    const len = clamp(dir.length() * f, this.controls.minDistance, this.controls.maxDistance)
    this.tweenCamera(t.clone().addScaledVector(dir.normalize(), len), t, 260)
  }
  setAutoRotate(on: boolean) {
    this.autoRotate = on
    this.controls.autoRotate = on
    this.controls.autoRotateSpeed = 1.3
  }
  getAutoRotate(): boolean { return this.autoRotate }
  private onDblClick = (e: MouseEvent) => {
    this.setNDC(e)
    const jHit = this.raycastJewels()
    if (jHit) {
      const j = this.store.jewels.find((x) => x.id === jHit.jewelId)
      if (j) { this.focusTooth(j.toothId); return }
    }
    const tHit = this.raycastTeeth()
    if (tHit) this.focusTooth(tHit.toothId)
  }

  /* ---------- presets & export ---------- */

  buildPresetJewels(p: Preset): PlacedJewelry[] {
    return p.items.map((it) => {
      const hit = this.getSurfacePoint(it.tooth, it.u ?? 0, it.v ?? 0)
      return {
        id: uid(), jewelryTypeId: it.type, toothId: it.tooth,
        position: v3(hit.point.x, hit.point.y, hit.point.z),
        normal: v3(hit.normal.x, hit.normal.y, hit.normal.z),
        rotation: it.rot ?? 0,
        scale: it.scale ?? JEWELRY_BY_ID[it.type].defaultScale,
        color: it.finish ?? JEWELRY_BY_ID[it.type].defaultColor,
      }
    })
  }
  /** Clean capture of the current view (overlays + highlights hidden) —
      shared by the PNG export and the quote sheet. */
  captureView(opts: { transparent?: boolean } = {}): string {
    const outlineVis: boolean[] = []
    this.jewelRigs.forEach((r) => { outlineVis.push(r.outline.visible); r.outline.visible = false })
    const emSave: number[] = []
    this.toothRigs.forEach((r) => { emSave.push(r.highlight); r.materials.forEach((m) => { m.emissiveIntensity = 0 }) })
    const ghostVis = this.ghost ? this.ghost.root.visible : false
    if (this.ghost) this.ghost.root.visible = this.ghost.ringRoot.visible = false
    const bd = this.backdrop.visible, fl = this.floor.visible
    if (opts.transparent) { this.backdrop.visible = false; this.floor.visible = false }
    this.renderer.render(this.scene, this.camera)
    const url = this.renderer.domElement.toDataURL('image/png')
    let i = 0
    this.jewelRigs.forEach((r) => { r.outline.visible = outlineVis[i++] })
    i = 0
    this.toothRigs.forEach((r) => { r.materials.forEach((m) => { m.emissiveIntensity = emSave[i] * 0.42 }) })
    if (this.ghost) this.ghost.root.visible = this.ghost.ringRoot.visible = ghostVis
    this.backdrop.visible = bd; this.floor.visible = fl
    this.renderer.render(this.scene, this.camera)
    return url
  }
  exportPNG(transparent: boolean) {
    const url = this.captureView({ transparent })
    let out = url
    if (!transparent) {
      const src = this.renderer.domElement
      const c = document.createElement('canvas'); c.width = src.width; c.height = src.height
      const ctx = c.getContext('2d')!
      const g = ctx.createRadialGradient(c.width / 2, c.height * 0.4, 0, c.width / 2, c.height * 0.4, Math.hypot(c.width, c.height) * 0.62)
      g.addColorStop(0, '#faf6ee'); g.addColorStop(0.5, '#efe7d9'); g.addColorStop(1, '#d8cbb4')
      ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height)
      ctx.drawImage(src, 0, 0)
      out = c.toDataURL('image/png')
    }
    downloadURL(out, `lumiere-design-${Date.now()}.png`)
  }
  exportJSON() {
    const data = {
      app: 'lumiere-dental-studio', version: 7, exportedAt: new Date().toISOString(),
      model: this.mergedMode ? 'custom-free' : (this.toothMeshes.length && (this.toothMeshes[0] as THREE.Mesh).isMesh ? 'studio-arch' : 'custom-teeth'),
      lightPreset: this.store.getSnapshot().lightPreset,
      quote: { currency: PRICING.currency, total: store.jewels.reduce((s, j) => s + priceOf(j), 0) },
      camera: { position: this.camera.position.toArray(), target: this.controls.target.toArray() },
      jewels: this.store.jewels,
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
    const url = URL.createObjectURL(blob)
    downloadURL(url, `lumiere-design-${Date.now()}.json`)
    setTimeout(() => URL.revokeObjectURL(url), 4000)
  }

  /* ---------- frame loop ---------- */

  private tick = () => {
    if (this.disposed) return
    this.raf = requestAnimationFrame(this.tick)
    const now = performance.now()
    const snap = this.store.getSnapshot()

    const tw = this.camTween
    if (tw) {
      const k = Math.min(1, (now - tw.start) / tw.dur)
      const eased = easeInOutCubic(k)
      this.camera.position.lerpVectors(tw.p0, tw.p1, eased)
      this.controls.target.lerpVectors(tw.t0, tw.t1, eased)
      this.camera.lookAt(this.controls.target)
      if (k >= 1) { this.camTween = null; this.controls.enabled = true; this.controls.update() }
    } else {
      this.controls.update()
    }

    // lighting preset crossfade (Studio / Chair lamp / Daylight)
    const lt = this.lightTarget, L = 0.1
    this.keyLight.intensity += (lt.key - this.keyLight.intensity) * L
    this.keyLight.color.lerp(lt.keyColor, L)
    this.keyLight.position.lerp(lt.keyPos, L)
    this.fillLight.intensity += (lt.fill - this.fillLight.intensity) * L
    this.fillLight.color.lerp(lt.fillColor, L)
    this.rimLight.intensity += (lt.rim - this.rimLight.intensity) * L
    this.scene.environmentIntensity += (lt.env - this.scene.environmentIntensity) * L
    this.renderer.toneMappingExposure += (lt.expo - this.renderer.toneMappingExposure) * L
    ;(this.backdrop.material as THREE.MeshBasicMaterial).color.lerp(lt.tint, L)

    this.toothRigs.forEach((rig, id) => {
      let t = 0
      if (id === this.hoverToothId) t = 0.55
      if (id === snap.selectedToothId) t = Math.max(t, 0.4)
      rig.highlight += (t - rig.highlight) * 0.16
      const v = rig.highlight * 0.42
      rig.materials.forEach((m) => { m.emissiveIntensity = v })
    })

    this.jewelRigs.forEach((rig, id) => {
      let anim = 1
      if (rig.birth) {
        const t = (now - rig.birth) / 420
        if (t >= 1) rig.birth = 0
        else anim = Math.max(0.02, backOut(t))
      }
      const hov = id === this.hoverJewelId ? 1 : 0
      rig.hoverT += (hov - rig.hoverT) * 0.22
      rig.group.scale.setScalar(Math.max(0.001, rig.sizeScale * anim * (1 + rig.hoverT * 0.09)))
      const op = snap.selectedJewelIds.includes(id) ? 0.9 : (id === this.hoverJewelId ? 0.38 : 0)
      rig.outlineMaterial.opacity += (op - rig.outlineMaterial.opacity) * 0.2
      rig.outline.visible = rig.outlineMaterial.opacity > 0.02
    })
    for (let i = this.dyingJewels.length - 1; i >= 0; i--) {
      const rig = this.dyingJewels[i]
      const t = (now - rig.death) / 200
      if (t >= 1) {
        this.jewelsGroup.remove(rig.group)
        rig.outlineMaterial.dispose() // jewel materials are cached+shared — not disposed here
        this.dyingJewels.splice(i, 1)
      } else {
        const s = Math.max(0.001, rig.sizeScale * (1 - t) * (1 - t))
        rig.group.scale.setScalar(s)
      }
    }
    if (this.ghost && this.ghost.root.visible) {
      const p = 0.5 + 0.5 * Math.sin(now / 170)
      this.ghost.ringMaterial.opacity = 0.35 + 0.4 * p
      this.ghost.ring.scale.setScalar(this.ghost.ringScale * (1 + 0.05 * p))
    }
    this.renderer.render(this.scene, this.camera)
  }

  private resize() {
    const w = this.container.clientWidth, h = this.container.clientHeight
    if (!w || !h) return
    this.renderer.setSize(w, h, false)
    this.camera.aspect = w / h
    this.camera.updateProjectionMatrix()
  }
  dispose() {
    this.disposed = true
    cancelAnimationFrame(this.raf)
    this.ro.disconnect()
    this.container.removeEventListener('pointerdown', this.onPointerDown, true)
    this.container.removeEventListener('contextmenu', this.onContextMenu)
    window.removeEventListener('pointermove', this.onPointerMove)
    window.removeEventListener('pointerup', this.onPointerUp)
    window.removeEventListener('pointercancel', this.onPointerUp)
    window.removeEventListener('blur', this.onBlur)
    this.controls.dispose()
    this.scene.traverse((o) => {
      const m = o as THREE.Mesh
      if (m.isMesh) { m.geometry.dispose(); const mats = Array.isArray(m.material) ? m.material : [m.material]; mats.forEach((x) => x?.dispose?.()) }
    })
    this.renderer.dispose()
    this.renderer.domElement.remove()
  }
}

function downloadURL(url: string, name: string) {
  const a = document.createElement('a')
  a.href = url; a.download = name
  document.body.appendChild(a); a.click(); a.remove()
}

/* ---- engine singleton (mounted once by <Viewport/>) ---- */
let engineInstance: StudioEngine | null = null
function getEngine(): StudioEngine | null { return engineInstance }
/** Collision-aware duplication (falls back to the store if the engine is absent). */
function duplicateSelectionSafe(ids: string[]): number {
  const e = getEngine()
  return e ? e.duplicateSelection(ids) : store.duplicateJewels(ids)
}

/* ---- shared .glb import entry (toolbar button · drag & drop · auto-load) ---- */
async function importModelFile(f: File) {
  toast(`Importing ${f.name}…`)
  try {
    const res = await getEngine()?.importGLB(f)
    if (res) {
      store.setModelMode(res.mode)
      if (res.mode === 'teeth') {
        toast(`Model imported — ${res.teeth} teeth ready`)
      } else {
        toast('Model imported in free mode — place jewels anywhere on the surface')
        setTimeout(() => toast('Tip: name tooth meshes 11–17 / 21–27 for exact per-tooth labels'), 2900)
      }
    }
  } catch (err) {
    toast(`Import failed: ${(err as Error).message}`)
  }
}

/* ===================== quote sheet (canvas composition) ================== */

function loadImageURL(src: string): Promise<HTMLImageElement> {
  return new Promise((res, rej) => {
    const img = new Image()
    img.onload = () => res(img)
    img.onerror = () => rej(new Error('image load failed'))
    img.src = src
  })
}
/** Compose the client-ready quote sheet as a high-res PNG. */
async function buildQuoteSheetDataURL(jewels: PlacedJewelry[], clientName: string, renderURL: string): Promise<string> {
  const img = await loadImageURL(renderURL)
  const W = 1240, M = 70
  const renderW = W - M * 2
  const renderH = Math.min(620, Math.max(300, Math.round(renderW * (img.height / img.width))))
  const rows = jewels.map((j) => ({
    name: JEWELRY_BY_ID[j.jewelryTypeId]?.name ?? j.jewelryTypeId,
    tooth: j.toothId === FREE_TOOTH ? '—' : j.toothId,
    size: `${(j.scale * 2).toFixed(1)} mm`,
    finish: j.customColor ? `Custom ${j.customColor.toUpperCase()}` : (FINISHES[j.color]?.label ?? j.color),
    price: priceOf(j),
  }))
  const rowH = 44
  const H = Math.max(1240, 210 + 60 + renderH + 46 + 46 + rows.length * rowH + 96 + 70)
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const x = c.getContext('2d')!

  // page + header band
  x.fillStyle = '#f6f2ea'; x.fillRect(0, 0, W, H)
  x.fillStyle = '#2b241b'; x.fillRect(0, 0, W, 132)
  x.fillStyle = '#f0e2c6'; x.font = '500 40px Fraunces, Georgia, serif'
  x.fillText('Lumière', M, 72)
  x.font = '700 12px Manrope, sans-serif'; x.fillStyle = '#c9b183'
  x.fillText('D E N T A L   J E W E L R Y   S T U D I O', M, 102)
  x.textAlign = 'right'
  x.fillStyle = '#f0e2c6'; x.font = '800 15px Manrope, sans-serif'
  x.fillText('DESIGN QUOTE', W - M, 66)
  x.fillStyle = '#c9b183'; x.font = '500 14px Manrope, sans-serif'
  x.fillText(new Date().toLocaleDateString(), W - M, 92)
  x.textAlign = 'left'

  // client line
  let y = 182
  x.fillStyle = '#a49a8b'; x.font = '800 11px Manrope, sans-serif'
  x.fillText('CLIENT', M, y)
  x.fillStyle = '#26211a'; x.font = '600 24px Manrope, sans-serif'
  x.fillText(clientName.trim() || '—', M + 92, y + 1)

  // live render
  y += 36
  x.drawImage(img, M, y, renderW, renderH)
  x.strokeStyle = '#e8e1d6'; x.lineWidth = 1
  x.strokeRect(M + 0.5, y + 0.5, renderW - 1, renderH - 1)

  // piece table
  y += renderH + 44
  const cols = { idx: M, name: M + 52, tooth: M + 470, size: M + 560, finish: M + 690, price: W - M }
  x.font = '800 11px Manrope, sans-serif'; x.fillStyle = '#a49a8b'
  x.fillText('#', cols.idx, y)
  x.fillText('PIECE', cols.name, y)
  x.fillText('TOOTH', cols.tooth, y)
  x.fillText('SIZE', cols.size, y)
  x.fillText('FINISH', cols.finish, y)
  x.textAlign = 'right'; x.fillText('PRICE', cols.price, y); x.textAlign = 'left'
  y += 14
  x.strokeStyle = '#d5c9ab'; x.beginPath(); x.moveTo(M, y + 0.5); x.lineTo(W - M, y + 0.5); x.stroke()
  y += 8
  rows.forEach((r, i) => {
    if (i % 2 === 1) { x.fillStyle = '#fffdf8'; x.fillRect(M - 12, y, W - 2 * M + 24, rowH) }
    const ty = y + 28
    x.fillStyle = '#26211a'; x.font = '600 17px Manrope, sans-serif'
    x.fillText(String(i + 1).padStart(2, '0'), cols.idx, ty)
    x.fillText(r.name, cols.name, ty)
    x.fillText(r.tooth, cols.tooth, ty)
    x.fillText(r.size, cols.size, ty)
    x.fillStyle = '#6f665a'; x.fillText(r.finish, cols.finish, ty)
    x.fillStyle = '#26211a'
    x.textAlign = 'right'; x.fillText(money(r.price), cols.price, ty); x.textAlign = 'left'
    y += rowH
    x.strokeStyle = '#efe8dc'; x.beginPath(); x.moveTo(M, y + 0.5); x.lineTo(W - M, y + 0.5); x.stroke()
  })

  // total
  y += 20
  const total = rows.reduce((s, r) => s + r.price, 0)
  x.font = '700 15px Manrope, sans-serif'; x.fillStyle = '#6f665a'
  x.fillText('TOTAL', M, y + 6)
  x.font = '600 34px Fraunces, Georgia, serif'; x.fillStyle = '#26211a'
  x.textAlign = 'right'; x.fillText(money(total), W - M, y + 10); x.textAlign = 'left'
  y += 44
  x.strokeStyle = '#a97d45'; x.beginPath(); x.moveTo(M, y + 0.5); x.lineTo(W - M, y + 0.5); x.stroke()

  // footer
  x.font = '500 12px Manrope, sans-serif'; x.fillStyle = '#a49a8b'
  x.fillText(`Estimate for the selected design · ${rows.length} ${rows.length === 1 ? 'piece' : 'pieces'} · Generated by Lumière Studio`, M, y + 32)
  return c.toDataURL('image/png')
}

/* ====================== HSV ↔ hex (colour wheel) ========================= */

function hsvToHex(h: number, s: number, v: number): string {
  h = ((h % 360) + 360) % 360
  const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c
  let r = 0, g = 0, b = 0
  if (h < 60) { r = c; g = x } else if (h < 120) { r = x; g = c } else if (h < 180) { g = c; b = x }
  else if (h < 240) { g = x; b = c } else if (h < 300) { r = x; b = c } else { r = c; b = x }
  const to = (t: number) => Math.round((t + m) * 255).toString(16).padStart(2, '0')
  return `#${to(r)}${to(g)}${to(b)}`
}
function hexToHsv(hex: string): { h: number; s: number; v: number } {
  const m = /^#?([0-9a-f]{6})$/i.exec((hex || '').trim())
  if (!m) return { h: 0, s: 0, v: 1 }
  const n = parseInt(m[1], 16)
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn
  let h = 0
  if (d > 0) {
    if (mx === r) h = 60 * (((g - b) / d) % 6)
    else if (mx === g) h = 60 * ((b - r) / d + 2)
    else h = 60 * ((r - g) / d + 4)
  }
  if (h < 0) h += 360
  return { h, s: mx === 0 ? 0 : d / mx, v: mx }
}

function useOutsideClose(open: boolean, onClose: () => void) {
  const ref = useRef<HTMLDivElement>(null)
  useEffect(() => {
    if (!open) return
    const h = (e: PointerEvent) => { if (ref.current && !ref.current.contains(e.target as Node)) onClose() }
    window.addEventListener('pointerdown', h)
    return () => window.removeEventListener('pointerdown', h)
  }, [open, onClose])
  return ref
}

  const presets = useUserPresets()
  useEffect(() => {
    if (!confirmDel) return
    const t = setTimeout(() => setConfirmDel(null), 2600)
    return () => clearTimeout(t)
  }, [confirmDel])
  const doSave = () => {
    const clean = name.trim()
    if (!clean) { toast('Give your preset a name first'); return }
    if (!store.jewels.length) { toast('Place at least one piece before saving'); return }

      setName(''); setSaving(false); setOpen(false)
      toast(`Preset “${clean}” saved`)

  return (
    <div className="menu-wrap" ref={ref}>

              </button>

function Viewport({ snap }: { snap: StudioSnapshot }) {
  const hostRef = useRef<HTMLDivElement>(null)
  const [, setReady] = useState(false)
  useEffect(() => {
    if (!hostRef.current) return
    engineInstance = new StudioEngine(hostRef.current, store)
    setReady(true)
    return () => { engineInstance?.dispose(); engineInstance = null }
  }, [])
  // drag & drop a .glb straight onto the stage
  useEffect(() => {
    const host = hostRef.current
    if (!host) return
    const over = (e: DragEvent) => { e.preventDefault(); host.classList.add('drag-over') }
    const leave = (e: DragEvent) => {
      if (!(e.relatedTarget instanceof Node) || !host.contains(e.relatedTarget)) host.classList.remove('drag-over')
    }
    const drop = (e: DragEvent) => {
      e.preventDefault()
      host.classList.remove('drag-over')
      const f = e.dataTransfer?.files?.[0]
      if (f && /\.(glb|gltf)$/i.test(f.name)) importModelFile(f)
    }
    host.addEventListener('dragover', over)
    host.addEventListener('dragleave', leave)
    host.addEventListener('drop', drop)
    return () => {
      host.removeEventListener('dragover', over)
      host.removeEventListener('dragleave', leave)
      host.removeEventListener('drop', drop)
    }
  }, [])

  const jewel = snap.jewels.find((j) => j.id === snap.selectedJewelIds[0])
  const chipTooth = snap.hoveredToothId ?? (jewel ? jewel.toothId : snap.selectedToothId)
  const armedName = snap.armedTypeId ? JEWELRY_BY_ID[snap.armedTypeId]?.name : null

  return (
    <div className="viewport" ref={hostRef}>
      {chipTooth && chipTooth !== FREE_TOOTH && (
        <div className="chip" key={chipTooth}>
          <span className="chip-fdi">{chipTooth}</span>
          <span className="chip-name">{toothInfo(chipTooth).name}</span>
        </div>
      )}
      {armedName && (
        <div className="pill" id="armedPill">
          <span className="dot" />
          <span>Click a tooth to place the {armedName}</span>
          <button title="Cancel" onClick={() => store.setArmed(null)}><I name="close" size={13} /></button>
        </div>
      )}
      {snap.placingTypeId && !armedName && (
        <div className="pill" id="placingPill"><span className="dot" /><span>Release over the model to place — red means the spot is taken</span></div>
      )}
      {snap.jewels.length === 0 && !snap.placingTypeId && !armedName && (
        <div className="pill" id="hintPill">
          <span className="dot" />
          <span>Drag a jewel onto a tooth to start designing</span>
        </div>
      )}
      {snap.contextMenu && <ContextMenu cm={snap.contextMenu} snap={snap} />}
      <BottomBar />
      <div className="stage-tag">
        {snap.modelMode === 'studio' ? 'UPPER ARCH · FDI NOTATION'
          : snap.modelMode === 'teeth' ? 'CUSTOM MODEL · FDI MAPPING'
          : 'CUSTOM MODEL · FREE MODE'}
      </div>
    </div>
  )
}

/* ---- right-click context menu on pieces ---- */
function ContextMenu({ cm, snap }: { cm: ContextMenuState; snap: StudioSnapshot }) {
  const ref = useRef<HTMLDivElement>(null)
  useEffect(() => {
    const h = (e: PointerEvent) => { if (ref.current && !ref.current.contains(e.target as Node)) store.closeContextMenu() }
    window.addEventListener('pointerdown', h, true)
    return () => window.removeEventListener('pointerdown', h, true)
  }, [])
  const ids = snap.selectedJewelIds.includes(cm.jewelId) ? [...snap.selectedJewelIds] : [cm.jewelId]
  const gems = snap.jewels.filter((j) => ids.includes(j.id))
  if (!gems.length) return null
  const multi = gems.length > 1
  const act = (fn: () => void) => { fn(); store.closeContextMenu() }
  const item = (label: string, icon: string, fn: () => void, danger = false) => (
    <button className={'ctx-item' + (danger ? ' danger' : '')} onClick={() => act(fn)}>
      <I name={icon} size={14} />{label}
    </button>
  )
  const doRotate = () => {
    store.pushHistory()
    store.applyPatches(gems.map((j) => ({ id: j.id, patch: { rotation: (j.rotation + 90) % 360 } })))
    toast(multi ? 'Selection rotated' : 'Piece rotated')
  }
  const doDuplicate = () => {
    const n = duplicateSelectionSafe(ids)
    if (!n) toast('No free space beside the selection')
    else if (n < ids.length) toast(`${n} of ${ids.length} duplicated — rest had no room`)
    else toast(multi ? 'Pieces duplicated' : 'Piece duplicated')
  }
  const doMirror = (axis: 'h' | 'v') => {
    const r = getEngine()?.mirrorSelection(axis)
    if (r) toast(r.skipped > 0 ? `Mirrored — ${r.skipped} kept in place (occupied)` : 'Mirrored')
  }
  return (
    <div className="ctx-menu" ref={ref} onContextMenu={(e) => e.preventDefault()}
      style={{ left: `min(${cm.x}px, calc(100% - 218px))`, top: `min(${cm.y}px, calc(100% - 252px))` }}>
      <div className="ctx-head">{multi ? `${gems.length} pieces selected` : JEWELRY_BY_ID[gems[0].jewelryTypeId]?.name}</div>
      {item(multi ? 'Rotate all +90°' : 'Rotate +90°', 'reset', doRotate)}
      {item(multi ? 'Duplicate all' : 'Duplicate', 'copy', doDuplicate)}
      {item('Mirror horizontal', 'mirrorH', () => doMirror('h'))}
      {item('Mirror vertical', 'mirrorV', () => doMirror('v'))}
      <div className="ctx-sep" />
      {item(multi ? 'Delete all' : 'Delete', 'trash', () => {
        store.removeJewels(ids)
        toast(multi ? `${gems.length} pieces removed` : 'Piece removed')
      }, true)}
    </div>
  )
}

function Slider({ label, value, min, max, step, format, onCommit }: {
  label: string; value: number; min: number; max: number; step: number
  format: (v: number) => string; onCommit: (v: number) => void
}) {
  const armed = useRef(false)
  const arm = () => { if (!armed.current) { store.pushHistory(); armed.current = true } }
  const pct = ((value - min) / (max - min)) * 100
  return (
    <div className="control">
      <div className="control-head"><span>{label}</span><span className="control-val">{format(value)}</span></div>
      <input type="range" className="range" min={min} max={max} step={step} value={value}
        style={{ '--fill': `linear-gradient(to right, var(--accent) ${pct}%, #ece4d6 ${pct}%)` } as React.CSSProperties}
        onPointerDown={arm} onKeyDown={arm}
        onPointerUp={() => { armed.current = false }} onKeyUp={() => { armed.current = false }}
        onChange={(e) => { const v = +e.target.value; arm(); onCommit(v) }} />
    </div>
  )
}
