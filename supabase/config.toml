# Supabase CLI configuration: only what this repository relies on; every other
# setting keeps the CLI default. The remote project is chosen with
# `supabase link --project-ref <ref>` (never written here).
project_id = "global-toothgems"

# These functions check their callers themselves:
# - stripe-webhook: Stripe sends no Supabase token; the Stripe signature
#   (STRIPE_WEBHOOK_SECRET) is the authentication.
# - create-checkout-session: guest checkout is the default, and the browser
#   calls it with the publishable key, which is not a JWT. A user token, when
#   present, is verified inside the function (auth.getUser).
# - invite-staff-member: a signed-in team member's JWT is required, but it is
#   verified inside the function (auth.getUser, then my_permissions() read with
#   that JWT), which also works with the project's asymmetric JWT signing keys.
# - deliver-gift-cards: called by pg_cron, not a browser; the shared secret
#   EMAIL_INTERNAL_SECRET in the x-internal-secret header is the authentication.
# - send-email: called by the webapp's server routes (contact acknowledgement,
#   newsletter confirmation), not a browser; same shared secret.
# - send-pending-emails: called by pg_cron (shipping, course enrolment, refund and
#   back-in-stock e-mails), not a browser; same shared secret.
# - submit-contact-request: the contact form is open to visitors, who call it with the
#   publishable key (not a JWT); a member's token is verified inside the function
#   (auth.getUser). Honeypot, per-address and per-account/e-mail throttles stand in for a captcha.
# - newsletter-subscribe: the storefront newsletter form is open to visitors, who call it with the
#   publishable key (not a JWT). Honeypot, a per-address throttle and the per-e-mail throttle of
#   newsletter_subscribe() stand in for a captcha.
# - sync-newsletter-contacts: called by pg_cron (mirrors the newsletter list into Resend contacts
#   and segments), not a browser; same shared secret EMAIL_INTERNAL_SECRET.
# - purge-storage-objects: called by pg_cron (removes the files the retention purge queued,
#   decision 127), not a browser; same shared secret EMAIL_INTERNAL_SECRET.
# - order-withdrawal: the shop's withdrawal function (decision 131) is open to guests, who call it
#   with the publishable key (not a JWT); a member's token is verified inside the function
#   (auth.getUser). Honeypot, a per-address throttle, the per-order throttle of
#   request_order_withdrawal_link() and Turnstile (when TURNSTILE_SECRET_KEY is set) guard the link.
# - glowbook-booking: Glowbook bookings (decision 144); the member's token is verified inside the
#   function (auth.getUser), then IP limit and Turnstile (when TURNSTILE_SECRET_KEY is set).
# - resend-webhook: Resend sends no Supabase token; the Svix signature
#   (RESEND_WEBHOOK_SECRET, five-minute tolerance) is the authentication.
[functions.create-checkout-session]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.deliver-gift-cards]
verify_jwt = false

[functions.send-email]
verify_jwt = false

[functions.send-pending-emails]
verify_jwt = false

[functions.email-showcase]
verify_jwt = false

[functions.resend-webhook]
verify_jwt = false

[functions.invite-staff-member]
verify_jwt = false

# Staff-only: the caller's JWT is checked inside the function (like invite-staff-member)
# and the database enforces `manage_orders` on every write.
[functions.refund-order]
verify_jwt = false

[functions.submit-contact-request]
verify_jwt = false

[functions.newsletter-subscribe]
verify_jwt = false

# Visitors' gift card balance check (decision 140): honeypot, address limit and captcha in the function.
[functions.gift-card-balance]
verify_jwt = false

[functions.sync-newsletter-contacts]
verify_jwt = false

[functions.purge-storage-objects]
verify_jwt = false

# 3D Studio subscriptions (decision 94): the member's token / the internal secret is checked in the function.
[functions.create-studio-subscription]
verify_jwt = false

[functions.studio-manage-subscription]
verify_jwt = false

[functions.studio-withdraw]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.studio-billing-setup]
verify_jwt = false

# 3D Studio smile try-on (decision 111): the status call is open, the member's token is checked in the function.
[functions.studio-try-on]
verify_jwt = false

[functions.order-withdrawal]
verify_jwt = false

[functions.glowbook-booking]
verify_jwt = false

# Glowbook calendar feed (decision 144, lot 2): calendar apps send no token; the secret in the address authenticates.
[functions.glowbook-calendar-feed]
verify_jwt = false

# Staff rights need a second factor (migration staff_mfa_required): the local
# stack offers TOTP like the hosted project, for the live E2E suite.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
